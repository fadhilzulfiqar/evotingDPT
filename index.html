<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EvotingDPT</title><style>
:root{--navy:#0d1b3d;--gold:#d4a72c;--bg:#f5f7fb;--card:#fff;--muted:#667085;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#172033}header{background:linear-gradient(135deg,#0d1b3d,#17346f);color:white;padding:26px 18px;text-align:center}header h1{margin:0;font-size:clamp(24px,5vw,42px)}header p{margin:8px 0 0;opacity:.9}.wrap{max-width:1050px;margin:28px auto;padding:0 16px}.card{background:var(--card);border-radius:18px;box-shadow:0 8px 28px rgba(16,24,40,.08);padding:22px;margin-bottom:20px}.login{max-width:430px;margin:34px auto}.input,.btn,textarea{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #d0d5dd;font-size:15px}.btn{border:0;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.btn.gold{background:var(--gold);color:#111}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.paslon{position:relative;overflow:hidden}.num{position:absolute;right:16px;top:12px;font-size:50px;font-weight:900;color:#e7ecf6}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.photos img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;background:#eef2f6}.label{font-size:12px;color:var(--muted);font-weight:700}.muted{color:var(--muted)}.notice{padding:12px;border-radius:10px;background:#eef4ff;margin:12px 0}.error{background:#fff0f0;color:var(--danger)}.success{background:#ecfdf3;color:#067647}.hidden{display:none!important}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2ff;font-size:12px;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><h1 id="title">EvotingDPT</h1><p id="subtitle">Pemilihan Ketua & Wakil Ketua DPT Politeknik Agraria STPN 2026–2027</p></header>
<div class="wrap">
<section id="login" class="card login"><h2>Masuk Pemilih</h2><p class="muted">Gunakan username/NIM dan password yang diberikan panitia.</p><div id="msg"></div><label class="label">USERNAME / NIM</label><input id="user" class="input" autocomplete="username"><br><br><label class="label">PASSWORD</label><input id="pass" type="password" class="input" autocomplete="current-password"><button class="btn" onclick="login()">MASUK KE PEMILIHAN</button><p class="muted" style="font-size:12px">Mode GitHub Pages ini untuk demo/latihan. Data tersimpan di browser perangkat ini.</p></section>
<section id="app" class="hidden"><div class="topbar"><div><span class="badge" id="who"></span><h2 style="margin:8px 0 0">Pilih Pasangan Calon</h2></div><button class="btn" style="width:auto;padding:10px 16px" onclick="logout()">Keluar</button></div><div id="votedNotice" class="notice hidden"></div><div id="candidates" class="grid"></div></section>
</div>
<script>
const K='evotingdpt_static_v1';
const DEFAULT_USERS=Array.from({length:10},(_,i)=>{const n=String(i+1).padStart(3,'0');return{name:'Pemilih '+n,username:'pemilih'+n,password:'DPT'+n,hasVoted:false}});
function freshData(){return {config:{title:'Pemilihan Ketua & Wakil Ketua DPT',institution:'Politeknik Agraria STPN',period:'2026–2027',tagline:'SATU SUARA, SATU PILIHAN, UNTUK DPT YANG LEBIH BAIK',candidates:[{id:'01',ketua:'Nama Calon Ketua 01',wakil:'Nama Calon Wakil 01',visi:'Tuliskan visi Paslon 01 di sini.',misi:'1. Misi pertama\n2. Misi kedua\n3. Misi ketiga',slogan:'Bersama membawa DPT lebih baik.',photoKetua:'assets/paslon1-ketua.jpg',photoWakil:'assets/paslon1-wakil.jpg'},{id:'02',ketua:'Nama Calon Ketua 02',wakil:'Nama Calon Wakil 02',visi:'Tuliskan visi Paslon 02 di sini.',misi:'1. Misi pertama\n2. Misi kedua\n3. Misi ketiga',slogan:'Bergerak bersama untuk kemajuan.',photoKetua:'assets/paslon2-ketua.jpg',photoWakil:'assets/paslon2-wakil.jpg'}]},users:DEFAULT_USERS,votes:{'01':0,'02':0},session:null,adminPassword:'GantiPasswordAdmin2026!'}}
function seed(){const raw=localStorage.getItem(K);if(!raw){localStorage.setItem(K,JSON.stringify(freshData()));return}const d=JSON.parse(raw);d.config=d.config||freshData().config;d.config.candidates=d.config.candidates||freshData().config.candidates;const pics=[['assets/paslon1-ketua.jpg','assets/paslon1-wakil.jpg'],['assets/paslon2-ketua.jpg','assets/paslon2-wakil.jpg']];d.config.candidates.forEach((c,i)=>{if(!c.photoKetua)c.photoKetua=pics[i][0];if(!c.photoWakil)c.photoWakil=pics[i][1]});d.users=d.users||[];DEFAULT_USERS.forEach(u=>{if(!d.users.some(x=>x.username===u.username))d.users.push({...u})});if(!d.adminPassword)d.adminPassword='GantiPasswordAdmin2026!';localStorage.setItem(K,JSON.stringify(d))}
function db(){return JSON.parse(localStorage.getItem(K))}function save(x){localStorage.setItem(K,JSON.stringify(x))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const d=db(),c=d.config;document.getElementById('title').textContent=c.title;document.getElementById('subtitle').textContent=c.institution+' • '+c.period;if(!d.session){loginBox();return}const u=d.users.find(x=>x.username===d.session);if(!u){d.session=null;save(d);loginBox();return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=u.name+' • '+u.username;const vn=document.getElementById('votedNotice');if(u.hasVoted){vn.classList.remove('hidden');vn.className='notice success';vn.textContent='Hak suara akun ini sudah digunakan pada perangkat/browser ini.'}else vn.classList.add('hidden');document.getElementById('candidates').innerHTML=c.candidates.map(x=>`<div class="card paslon"><div class="num">${x.id}</div><div class="photos"><img src="${x.photoKetua||'https://placehold.co/400x500?text=Foto+Ketua'}"><img src="${x.photoWakil||'https://placehold.co/400x500?text=Foto+Wakil'}"></div><h3>${esc(x.ketua)} & ${esc(x.wakil)}</h3><p><b>Visi</b><br>${esc(x.visi)}</p><p><b>Misi</b><br>${esc(x.misi).replace(/\n/g,'<br>')}</p><p><i>“${esc(x.slogan)}”</i></p><button class="btn gold" ${u.hasVoted?'disabled':''} onclick="vote('${x.id}')">PILIH PASLON ${x.id}</button></div>`).join('')}
function loginBox(){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}
function login(){const d=db(),un=document.getElementById('user').value.trim(),pw=document.getElementById('pass').value,u=d.users.find(x=>x.username===un&&x.password===pw);if(!u){document.getElementById('msg').innerHTML='<div class="notice error">Username atau password salah.</div>';return}d.session=u.username;save(d);render()}
function vote(id){const d=db(),u=d.users.find(x=>x.username===d.session);if(!u||u.hasVoted)return;if(!confirm('Yakin memilih Paslon '+id+'? Pilihan pada browser ini tidak dapat diubah.'))return;u.hasVoted=true;u.votedAt=new Date().toISOString();d.votes[id]=(d.votes[id]||0)+1;save(d);render();alert('Suara latihan berhasil direkam.')}
function logout(){const d=db();d.session=null;save(d);render()}
seed();render();
</script></body></html>
