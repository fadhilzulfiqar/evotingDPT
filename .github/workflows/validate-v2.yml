name: Validate E-Voting DPT Fresh Project

on:
  push:
    branches:
      - evotingdpt-fresh-project
      - netlify-redesign
  pull_request:
    branches:
      - evotingdpt-fresh-project
      - netlify-redesign

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check netlify/functions/api-v2.mjs
          node --check netlify/functions/api.mjs
          node --check public/v2.js
          node --check public/admin-v2.js
          node --check scripts/load-test-v2.mjs
